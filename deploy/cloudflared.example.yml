# ~/.cloudflared/config.yml -- Cloudflare Tunnel from a public hostname to the
# dashboard. Create the tunnel once (`cloudflared tunnel login`, then
# `cloudflared tunnel create eve-dashboard`), paste its id below, and route the
# hostname with `cloudflared tunnel route dns eve-dashboard db.example.com`.
# The dashboard itself keeps listening on loopback; only the tunnel reaches it.
tunnel: <tunnel-id>
credentials-file: /home/<user>/.cloudflared/<tunnel-id>.json
ingress:
  - hostname: db.example.com
    service: http://127.0.0.1:8787
  - service: http_status:404
